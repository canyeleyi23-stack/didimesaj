<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DİDİ MESAJ - Özel Giriş</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#07111f,#102a43,#07111f);
 color:white
}
.card{
 width:min(420px,92vw);
 padding:38px 30px;
 border-radius:28px;
 background:rgba(12,25,42,.96);
 box-shadow:0 25px 70px rgba(0,0,0,.55);
 border:1px solid rgba(255,255,255,.10);
 text-align:center
}
.logo{
 width:82px;
 height:82px;
 margin:auto;
 border-radius:24px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:34px;
 font-weight:800;
 background:linear-gradient(135deg,#1677ff,#00b7ff);
 box-shadow:0 12px 30px rgba(0,150,255,.30)
}
h1{margin:20px 0 7px;font-size:30px}
.sub{color:#9eb1c7;font-size:14px;margin-bottom:28px}
.lock{
 display:inline-block;
 padding:7px 13px;
 border-radius:20px;
 background:#102f4c;
 color:#6fc8ff;
 font-size:12px;
 margin-bottom:20px
}
label{
 display:block;
 text-align:left;
 color:#b8c7d8;
 font-size:13px;
 margin:14px 3px 7px
}
input{
 width:100%;
 padding:16px;
 border-radius:14px;
 border:1px solid #29445e;
 outline:none;
 background:#091827;
 color:white;
 font-size:16px
}
input:focus{border-color:#168cff}
button{
 width:100%;
 margin-top:24px;
 padding:16px;
 border:0;
 border-radius:14px;
 background:linear-gradient(90deg,#087cff,#00b7ff);
 color:white;
 font-size:16px;
 font-weight:700;
 cursor:pointer
}
.info{
 margin-top:22px;
 padding:13px;
 border-radius:13px;
 background:#0a1d30;
 color:#91a9c0;
 font-size:12px;
 line-height:1.5
}
.admin{
 margin-top:18px;
 color:#5ebcff;
 font-size:12px
}
</style>
</head>
<body>
<div class="card">
 <div class="logo">D</div>
 <h1>DİDİ MESAJ</h1>
 <div class="sub">Özel aile iletişim uygulaması</div>

 <div class="lock">🔒 SADECE İZİNLİ KULLANICILAR</div>

 <label>Telefon numarası</label>
 <input id="phone" type="tel" placeholder="05xx xxx xx xx">

 <label>PIN</label>
 <input id="pin" type="password" maxlength="6" placeholder="PIN">

 <button onclick="login()">GİRİŞ YAP</button>

 <div class="info">
   Bu uygulama herkese açık değildir.<br>
   Yalnızca yönetici tarafından izin verilen kişiler
   DİDİ MESAJ'ı kullanabilir.
 </div>

 <div class="admin">Yönetici kontrollü özel sistem</div>
</div>

<script>
function login(){
 const p=document.getElementById("phone").value.trim();
 const pin=document.getElementById("pin").value.trim();

 if(!p || !pin){
   alert("Telefon numarası ve PIN giriniz.");
   return;
 }

 alert("Giriş sistemi hazır. Kullanıcı yetkilendirme sunucusu bağlandığında yalnızca izin verilen hesaplar giriş yapabilecek.");
}
</script>
</body>
</html>
